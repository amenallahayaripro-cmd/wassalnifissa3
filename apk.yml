name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: "stable"
          cache: true

      - name: Create Android project if missing
        run: |
          if [ ! -d "android" ]; then
            cp lib/main.dart /tmp/main.dart.bak
            cp pubspec.yaml /tmp/pubspec.yaml.bak
            flutter create . --project-name wassalni --org com.wassalni --platforms android
            cp /tmp/main.dart.bak lib/main.dart
            cp /tmp/pubspec.yaml.bak pubspec.yaml
            rm -rf test
          fi

      - name: Configure Android (app name, permissions, call/SMS, notifications)
        run: |
          python3 - <<'PY'
          import re, pathlib

          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          t = m.read_text()
          t = re.sub(r'android:label="[^"]*"', 'android:label="Wassalni"', t, count=1)
          perms = ['android.permission.POST_NOTIFICATIONS', 'android.permission.VIBRATE']
          add = ''.join('    <uses-permission android:name="%s"/>\n' % p for p in perms if p not in t)
          t = t.replace('<application', add + '    <application', 1)
          q = ('<intent><action android:name="android.intent.action.VIEW"/><data android:scheme="tel"/></intent>'
               '<intent><action android:name="android.intent.action.VIEW"/><data android:scheme="sms"/></intent>')
          if '<queries>' in t:
              t = t.replace('<queries>', '<queries>' + q, 1)
          else:
              t = t.replace('</manifest>', '    <queries>' + q + '</queries>\n</manifest>', 1)
          m.write_text(t)

          g = pathlib.Path('android/app/build.gradle')
          if g.exists():
              s = g.read_text()
              if 'coreLibraryDesugaringEnabled' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
                  s += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'\n}\n"
              g.write_text(s)
          print(m.read_text())
          print(g.read_text() if g.exists() else 'NO build.gradle (kts?)')
          PY

      - name: Get dependencies
        run: timeout 300 flutter pub get || timeout 300 flutter pub get

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: wassalni-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
